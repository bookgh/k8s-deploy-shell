name: shell-ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install shell tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck shfmt bats jq
      - name: Syntax
        run: find bin scripts tests -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
      - name: ShellCheck
        run: find bin scripts tests -type f -name '*.sh' -print0 | xargs -0 -r shellcheck -S warning
      - name: shfmt report
        run: |
          if ! shfmt -d -i 2 -ci bin scripts tests; then
            echo "::warning::shfmt found formatting differences; formatting is reported but not yet a blocking gate"
          fi
      - name: Download pinned CFSSL test tools
        run: |
          cache=/var/lib/k8s-deploy-shell/artifacts/cache
          sudo install -d -o "$USER" -g "$USER" -m 0755 "$cache"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --tlsv1.2 -o "$cache/cfssl_1.7.1_linux_amd64" https://github.com/cloudflare/cfssl/releases/download/v1.7.1/cfssl_1.7.1_linux_amd64
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --tlsv1.2 -o "$cache/cfssljson_1.7.1_linux_amd64" https://github.com/cloudflare/cfssl/releases/download/v1.7.1/cfssljson_1.7.1_linux_amd64
          printf '%s  %s\n' 'a0fc7012d326705f5a318a0c5de7ef79a8a096e70ece13cebfc9c4af671ee02e' "$cache/cfssl_1.7.1_linux_amd64" | sha256sum -c -
          printf '%s  %s\n' '56783aa96f1554c765670b1ea6182bfb863a3cbfcd87032aa4423bdc1604dc74' "$cache/cfssljson_1.7.1_linux_amd64" | sha256sum -c -
          chmod 0644 "$cache/cfssl_1.7.1_linux_amd64" "$cache/cfssljson_1.7.1_linux_amd64"
      - name: Install pinned Helm 3 and lint local charts
        run: |
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --tlsv1.2 -o /tmp/helm-v3.22.1-linux-amd64.tar.gz https://get.helm.sh/helm-v3.22.1-linux-amd64.tar.gz
          printf '%s  %s\n' '896cf63684a42a723d61c980369d6e588330927deb13676ca0d85006dd6da0ea' /tmp/helm-v3.22.1-linux-amd64.tar.gz | sha256sum -c -
          tar -xzf /tmp/helm-v3.22.1-linux-amd64.tar.gz -C /tmp
          /tmp/linux-amd64/helm version --short | grep -Fq 'v3.22.1'
          /tmp/linux-amd64/helm lint charts/nodelocaldns
      - name: Verify pinned upstream addon chart archives
        run: |
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' -o /tmp/tigera-operator-v3.33.0.tgz https://github.com/projectcalico/calico/releases/download/v3.33.0/tigera-operator-v3.33.0.tgz
          printf '%s  %s\n' 'efcc8633742c136708cd8de9673862c6eee3a91ed176d7f2835690ab625ad846' /tmp/tigera-operator-v3.33.0.tgz | sha256sum -c -
          /tmp/linux-amd64/helm lint /tmp/tigera-operator-v3.33.0.tgz
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' -o /tmp/projectcalico.org.v3-v3.33.0.tgz https://github.com/projectcalico/calico/releases/download/v3.33.0/projectcalico.org.v3-v3.33.0.tgz
          printf '%s  %s\n' 'ae76d7eeb13d132012fa0f24ba8972aa0ca6dd9810edf5b643d3cc713e7b86fc' /tmp/projectcalico.org.v3-v3.33.0.tgz | sha256sum -c -
          /tmp/linux-amd64/helm lint /tmp/projectcalico.org.v3-v3.33.0.tgz
          /tmp/linux-amd64/helm template calico-crds /tmp/projectcalico.org.v3-v3.33.0.tgz --api-versions admissionregistration.k8s.io/v1/MutatingAdmissionPolicy > /tmp/calico-crds.yaml
          grep -q CustomResourceDefinition /tmp/calico-crds.yaml
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' -o /tmp/coredns-1.48.2.tgz https://github.com/coredns/helm/releases/download/coredns-1.48.2/coredns-1.48.2.tgz
          printf '%s  %s\n' '7543caa3d30ef91660bf4373384ef657e09fdb42133d4163b0792613c808a464' /tmp/coredns-1.48.2.tgz | sha256sum -c -
          /tmp/linux-amd64/helm lint /tmp/coredns-1.48.2.tgz
      - name: Bats
        run: bats tests
      - name: Reject forbidden implementation languages
        run: |
          if find bin scripts tests -type f \( -name '*.py' -o -name '*.pl' -o -name '*.rb' -o -name '*.js' -o -name '*.go' \) | grep -q .; then
            echo 'Forbidden implementation language file detected' >&2
            exit 1
          fi
          if grep -RInE '(^|[;&|][[:space:]]*|^[[:space:]]+)(python([0-9.]*)?|perl|ruby|node|go)[[:space:]]+(-[ce]|run|build|test|install|[A-Za-z0-9_./-]+\.(py|pl|rb|js|go))' bin scripts tests; then
            echo 'Forbidden interpreter invocation detected' >&2
            exit 1
          fi
