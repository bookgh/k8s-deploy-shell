name: resolve-kubernetes-checksums
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/resolve-kubernetes-checksums.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checksums:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch official Kubernetes release checksums
        shell: bash
        run: |
          set -Eeuo pipefail
          version=v1.37.2
          for binary in kube-apiserver kube-controller-manager kube-scheduler kubelet kube-proxy kubectl; do
            url="https://dl.k8s.io/release/${version}/bin/linux/amd64/${binary}.sha256"
            digest="$(curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --tlsv1.2 --max-time 45 "$url")"
            [[ "$digest" =~ ^[a-fA-F0-9]{64}$ ]] || { echo "Invalid checksum response for $binary" >&2; exit 1; }
            printf '%s\t%s\t%s\n' "$binary" "${digest,,}" "$url"
          done
